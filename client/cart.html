<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mughals Wardrobe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="images/favicon.png" type="image/png">

</head>
<body>

    <section id="header">
        <div class="brand-left">Mughals Wardrobe</div>
    
        <div class="logo-center">
            <img src="images/logoblack.png" alt="Logo">
        </div>
    
        <ul id="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="signup.html"><i class="fas fa-user"></i></a></li>
            <li><a class="active" href="cart.html"><i class="fas fa-shopping-cart"></i><span id="cart-count" class="cart-count-badge">0</span></a></li>
        </ul>
        <button id="mobile-menu" aria-label="Toggle menu" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </button>
    </section>

    <section id="page-header" class="contact-header">
        <h2>Your Cart</h2>
        <p>Review your items before checkout.</p>
    </section>

    <section id="cart" class="section-p1">
        <table width="100%">
            <thead>
                <tr>
                    <td>Remove</td>
                    <td>Image</td>
                    <td>Product</td>
                    <td>Price</td>
                    <td>Quantity</td>
                    <td>SubTotal</td> 
                </tr>
            </thead>
            <tbody id="cart-body">
                <tr>
                    <td colspan="6">Loading cart...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <section id="subtotal">
        <h3>Cart Totals</h3>
        <table>
            <tr>
                <td>Cart Subtotal</td>
                <td id="cart-subtotal">Rs:0</td>
            </tr>
            <tr>
                <td>Shipping</td>
                <td>Free</td>
            </tr>
            <tr>
                <td><strong>Total</strong></td>
                <td><strong id="cart-total">Rs:0</strong></td>
            </tr>
        </table>
        <button class="normal">Proceed to checkout</button>
    </section>

    <footer class="section-p1">
        <div class="footer-container">
          
            <div class="footer-column">
              <img src="images/logoblack.png" alt="Logo" class="footer-logo">
            </div>
       
            <div class="footer-column">
              <h3>Follow Us</h3>
              <div class="social-icons">
                <img src="images/instagram.png" alt="Instagram">
                <img src="images/gmail.png" alt="Mail">
                <img src="images/youtube.png" alt="YouTube">
              </div>
            </div>
        
            <div class="footer-column">
              <h3>Payment Options</h3>
              <div class="payment-icons">
                <img src="images/visa.png" alt="Visa">
                <img src="images/card.png" alt="MasterCard">
              </div>
            </div>
          </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>.
